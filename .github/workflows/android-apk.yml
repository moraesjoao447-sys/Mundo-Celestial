name: Compilar Mundo Celestial

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o Mundo_Celestial_Projeto.zip -d extraido
          echo "Conteudo extraido:"
          find extraido -maxdepth 3 | head -50

      - name: Localizar projeto
        run: |
          GODOT_FILE=$(find extraido -name project.godot | head -1)
          if [ -z "$GODOT_FILE" ]; then
            echo "ERRO: project.godot nao encontrado no zip"
            exit 1
          fi
          PROJ_DIR=$(dirname "$GODOT_FILE")
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "Projeto encontrado em: $PROJ_DIR"

      - name: Importar recursos
        run: |
          godot --headless --editor --path "$PROJ_DIR" --quit || true

      - name: Configurar exportacao Android
        run: |
          cat > "$PROJ_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoCelestial.apk"

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.mundocelestial.rpg"
          package/name="Mundo Celestial"
          EOF
      - name: Diagnostico
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java javac keytool || true
          readlink -f "$(which javac)" || true
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls /usr/lib/android-sdk 2>&1 | head
          ls /root/android-sdk 2>&1 | head
          ls /opt 2>&1 | head
          find / -maxdepth 4 -name "build-tools" -type d 2>/dev/null | head
      - name: Preparar ambiente Android
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "Build-tools instalados:"
          ls $ANDROID_HOME/build-tools
          SDKM=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -1)
          echo "sdkmanager: $SDKM"
          yes | $SDKM --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
                    echo "--- conteudo do build-tools/33.0.2 ---"
          ls -la $ANDROID_HOME/build-tools/33.0.2 | head -30
          ls $ANDROID_HOME/platforms
          
                     $SDKM --sdk_root=$ANDROID_HOME --install "build-tools;34.0.0" "platforms;android-34" "platform-tools" "cmake;3.10.2.4988404""build-tools;33.0.2" "platforms;android-33" "platform-tools"
          echo "--- depois da reinstalacao ---"
          ls $ANDROID_HOME/build-tools/33.0.2 | head -30
          ls $ANDROID_HOME/build-tools
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Gerar APK
        run: |
          mkdir -p "$PROJ_DIR/build"
          godot --headless --path "$PROJ_DIR" --export-debug "Android" build/MundoCelestial.apk
          ls -la "$PROJ_DIR/build"
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-Celestial-APK
          path: ${{ env.PROJ_DIR }}/build/MundoCelestial.apk
          if-no-files-found: error
