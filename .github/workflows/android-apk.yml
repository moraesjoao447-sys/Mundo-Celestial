name: Compilar Mundo Celestial

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o Mundo_Celestial_Projeto.zip -d extraido
          echo "Conteudo extraido:"
          find extraido -maxdepth 3 | head -50

      - name: Localizar projeto
        run: |
          GODOT_FILE=$(find extraido -name project.godot | head -1)
          if [ -z "$GODOT_FILE" ]; then
            echo "ERRO: project.godot nao encontrado no zip"
            exit 1
          fi
          PROJ_DIR=$(dirname "$GODOT_FILE")
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "Projeto encontrado em: $PROJ_DIR"

      - name: Importar recursos
        run: |
          godot --headless --editor --path "$PROJ_DIR" --quit || true

      - name: Configurar exportacao Android
        run: |
          cat > "$PROJ_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoCelestial.apk"

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.mundocelestial.rpg"
          package/name="Mundo Celestial"
          EOF

      - name: Gerar APK
        run: |
          mkdir -p "$PROJ_DIR/build"
          godot --headless --path "$PROJ_DIR" --export-debug "Android" build/MundoCelestial.apk
          ls -la "$PROJ_DIR/build"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-Celestial-APK
          path: ${{ env.PROJ_DIR }}/build/MundoCelestial.apk
          if-no-files-found: error
