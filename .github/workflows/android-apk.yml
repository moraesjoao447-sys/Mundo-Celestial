name: Compilar Mundo Celestial

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -o Mundo_Celestial_Projeto.zip -d extraido

      - name: Localizar projeto
        run: |
          GODOT_FILE=$(find extraido -name project.godot | head -1)
          if [ -z "$GODOT_FILE" ]; then
            echo "ERRO: project.godot nao encontrado no zip"
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$GODOT_FILE")" >> $GITHUB_ENV

      - name: Importar recursos
        run: |
          godot --headless --editor --path "$PROJ_DIR" --quit 2>&1 | tail -30 || true

      - name: Configurar exportacao Android
        shell: bash
        run: |
          cat > "$PROJ_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.mundocelestial.rpg"
          package/name="Mundo Celestial"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/internet=false
          EOF

      - name: Preparar ambiente Android
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          SDKM=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -1)
          yes | $SDKM --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
          $SDKM --sdk_root=$ANDROID_HOME --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Gerar APK
        shell: bash
        run: |
          mkdir -p "$PROJ_DIR/build"
          godot --headless --verbose --path "$PROJ_DIR" --export-debug "Android" "$PWD/$PROJ_DIR/build/MundoCelestial.apk" > /tmp/export.log 2>&1 || true
          echo "--- log do Godot ---"
          grep -v "^$" /tmp/export.log | tail -25
          ls -la "$PROJ_DIR/build"
          test -f "$PROJ_DIR/build/MundoCelestial.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-Celestial-APK
          path: ${{ env.PROJ_DIR }}/build/MundoCelestial.apk
          if-no-files-found: error
